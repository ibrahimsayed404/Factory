  </defs>
  <!-- Outer Left Ear -->
  <polygon points="50,48 20,8 14,38" fill="url(#bfDark)" />
  <!-- Inner Left Ear -->
  <polygon points="50,48 20,8 30,38" fill="url(#bfPrimary)" />
